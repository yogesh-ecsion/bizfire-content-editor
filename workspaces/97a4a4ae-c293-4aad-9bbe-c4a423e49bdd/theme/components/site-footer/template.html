<footer class="site-footer" role="contentinfo">

    <!-- ======== MAIN FOOTER (DARK) ======== -->
    <div class="footer-main">
        <div class="container">

            <div class="row">

                <!-- Column 1: Logo + Brand -->
                <div class="col-lg-3 col-md-6">
                    <div class="footer-brand">
                           <a href="#" class="logo" aria-label="BIZfire home">
                    
                          <img src="{{logo.src}}" alt="{{logo.alt}}" class="logo-dark" width="180" height="48">
                    </a>
                        {{#if tagline}}<p class="brand-tagline">{{{tagline}}}</p>{{/if}}
                    </div>
                </div>

                {{#each navColumns}}
                <div class="col-lg-3 col-md-6">
                    <h4 class="footer-heading">{{heading}}</h4>
                    <ul class="footer-links">
                        {{#each links}}
                        <li><a href="{{url}}">{{label}}</a></li>
                        {{/each}}
                    </ul>
                </div>
                {{/each}}

            </div> <!-- /row -->

        </div> <!-- /container -->
    </div> <!-- /footer-main -->

    <!-- ======== BOTTOM FOOTER (WHITE) ======== -->
    <div class="footer-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-md-8 col-12">
                    <ul class="legal-links">
                        {{#each legalLinks}}
                        <li><a href="{{url}}">{{label}}</a></li>
                        {{/each}}
                    </ul>
                </div>

                <div class="col-md-4 col-12">
                    <p class="copyright">{{{copyright}}}</p>
                </div>

            </div> <!-- /row -->
        </div> <!-- /container -->
    </div> <!-- /footer-bottom -->

  <!-- Floating WhatsApp Button -->
<a href="{{whatsapp.url}}" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
    <i class="fa-brands fa-whatsapp whatsapp-icon" style="font-size: 22px;"></i>
    <span>{{whatsapp.label}}</span>
</a>
  
</footer>
