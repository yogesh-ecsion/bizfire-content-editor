<section class="steps-section bg-light-gray section-padding py-lg-6">
  <div class="container">

    <!-- ========== HEADER ========== -->
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9 text-center">

        <!-- Heading -->
        {{#if title}}
        <h2 class="section-title">{{{title}}}</h2>
        {{/if}}

        <!-- Subheading -->
        {{#if subtitle}}
        <p class="section-subtitle">
          {{{subtitle}}}
        </p>
        {{/if}}

        <!-- Supporting Text -->
        {{#if desc}}
        <p class="section-desc">
          {{{desc}}}
        </p>
        {{/if}}

      </div>
    </div>

    <!-- ========== CONTENT ROW ========== -->
    <div class="row align-items-stretch gx-4 gy-4">

      <!-- ===== LEFT COLUMN: STEP CARDS ===== -->
      <div class="col-lg-6 col-12">
        <div class="steps-cards-wrapper">
          {{#each items}}
          <div class="card-body card-body-flex">
            <div class="step-circle">{{#if stepNumber}}{{stepNumber}}{{else}}{{@index}}{{/if}}</div>
            <div class="step-content">
              <h3 class="step-title">{{title}}</h3>
              <p class="step-text">
                {{desc}}
              </p>
            </div>
          </div>
          {{/each}}
        </div>
      </div>

      <!-- ===== RIGHT COLUMN: IMAGE ===== -->
      <div class="col-lg-6 col-12 step-image-card-home">
      </div>

    </div>
    <!-- /row -->
    <br>
    <div class="button-group justify-content-start">

      {{#if phoneText}}
      <!-- Button 1: Outlined phone -->
      <a href="{{#if phoneUrl}}{{phoneUrl}}{{else}}tel:1234567890{{/if}}" class="btn-outline-phone">
        <i class="fa-solid fa-phone"></i>
        {{phoneText}}
      </a>
      {{/if}}

      {{#if chatText}}
      <!-- Button 2: Filled chat -->
      <a href="{{#if chatUrl}}{{chatUrl}}{{else}}#{{/if}}" target="_blank" class="btn-filled-chat">
        <i class="fa-solid fa-message"></i>
        {{chatText}}
      </a>
      {{/if}}

    </div>
  </div>
  <!-- /container -->
</section>
